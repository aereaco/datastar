</head>
<body class="prose w-full">
    <admin-header data-component="_components/admin-header.tmpl" class="admin-header"></admin-header>

    <admin-tabs
        data-component="_components/admin-tabs.tmpl"
        class="admin-tabs bg-base-300/80 -mb-14 z-10 transition-all"
        :class="{ '-mt-16 h-0 overflow-hidden': !appData.bookmarks.visible, }"
     ></admin-tabs>
    
    <admin-sidebar
        id="sidebar"
        data-component="_components/admin-sidebar.tmpl"
        class="admin-sidebar bg-neutral"
        :class="{ 'open': sidebarOpen, 'hovered': sidebarHovered && !sidebarOpen }"
        @mouseenter="if (!sidebarOpen) sidebarHovered = true"
        @mouseleave="sidebarHovered = false; if (!event.target.closest('#sidebar .close')) sidebarOpen = false;"
    ></admin-sidebar>

    <admin-main
        data-component="_components/admin-main.tmpl"
        class="admin-main"
    ></admin-main>
