<!DOCTYPE html>
<html lang="en"
  x-data="{
    appData: JSON.parse(localStorage.getItem('appData')) || {
      theme: {
        state: 0,
        expanded: false,
        direction: 'ltr',
        zoom: { value: 1, temp: 1 },
        types: [
          { type: 'light', title: 'Light', selected: 'light', template: 'sun-svg' },
          { type: 'dark', title: 'Dark', selected: 'dark', template: 'moon-svg' },
          { type: 'system', title: 'System', selected: 'system', template: 'brightness-svg' }
        ]
      },
      themes: [
        'light',
        'dark',
        'cupcake',
        'bumblebee',
        'emerald',
        'corporate',
        'synthwave',
        'retro',
        'cyberpunk',
        'valentine',
        'halloween',
        'garden',
        'forest',
        'aqua',
        'lofi',
        'pastel',
        'fantasy',
        'wireframe',
        'black',
        'luxury',
        'dracula',
        'cmyk',
        'autumn',
        'business',
        'acid',
        'lemonade',
        'night',
        'coffee',
        'winter',
        'dim',
        'nord',
        'sunset'
      ],
      bookmarks: {
        visible: false,
        list:[
          { title: 'Home', icon: 'home', pinned: true, route:'/' },
          { title: 'E-commerce', icon: null , pinned: false, route:'/ecommerce' },
          { title: 'Communication', icon: null , pinned: false, route:'/communication' }
        ] 
      }
    },
    
    get currentTheme() {
        if (this.appData.theme.types[this.appData.theme.state].selected === 'system') {
            const systemThemes = this.appData.theme.types.filter(t => t.type === 'light' || t.type === 'dark');
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? systemThemes[1].selected : systemThemes[0].selected;
        } else {
            return this.appData.theme.types[this.appData.theme.state].selected;
        }
    },
    toggleBookmarks() {
        this.appData.bookmarks.visible = !this.appData.bookmarks.visible ;
        localStorage.setItem('appData', JSON.stringify(this.appData));
    },
    switchTheme() {
        this.appData.theme.state = (this.appData.theme.state + 1) % this.appData.theme.types.length;
        localStorage.setItem('appData', JSON.stringify(this.appData));
    },
    updateTheme(theme) {
      this.appData.theme.types[this.appData.theme.state].selected = theme;
      localStorage.setItem('appData', JSON.stringify(this.appData));
    },
    toggleThemeExpanded() {
        this.appData.theme.expanded = !this.appData.theme.expanded;
        localStorage.setItem('appData', JSON.stringify(this.appData));
    },
    toggleThemeDirection() {
        this.appData.theme.direction = this.appData.theme.direction === 'ltr' ? 'rtl' : 'ltr';
        localStorage.setItem('appData', JSON.stringify(this.appData));
    },
    updateZoom() {
        this.appData.theme.zoom.value = this.appData.theme.zoom.temp;
        localStorage.setItem('appData', JSON.stringify(this.appData));
    }
  }"
  x-init="() => {
    const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
    mediaQuery.addEventListener('change', () => {
         // Force Alpine to re-evaluate currentTheme
         $data.appData = {...$data.appData}
    });
 }"
  :data-theme="currentTheme"
  :dir="appData.theme.direction"
  :style="{ fontSize: `${appData.theme.zoom.value}rem` }"
>
  
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aerea Dashboard</title>
    <!-- DaisyUI -->
    <link href="assets/styles/daisyui@4.12.23.css" rel="stylesheet" type="text/css" />

    <!-- OverlayScrollbars -->
    <link href="assets/styles/overlayscrollbars@2.10.1.css" rel="stylesheet" type="text/css">   
    <script src="assets/scripts/overlayscrollbars@2.10.1.js"></script>
    <script src="assets/scripts/globalscrollbars-osb-plugin.js" async></script>
      
    <!-- TailwindCSS -->
    <script src="assets/scripts/tailwindcss@3.4.16.js"></script>

    <!-- AlpineJS & Plugins -->
    <script src="assets/scripts/alpinejs@3.14.8.js" defer></script>
    <script src="assets/scripts/alpinejs-web-components@0.1.3.js"></script>

    <!-- HTMX -->


    <!-- Web Components -->
    <script src="assets/scripts/webcomponents.js" deter></script>
    <style>
            
      h1 {
        font-size: 1.25rem;
        line-height: 1.25;
      }

      h2 {
        font-size: 0.875rem;
      }

      p {
        margin-block-end: 1.5rem;
      }

      body, html {
        height: 100vh;
        transition: margin-inline 5.3s ease-in-out;
      }

      
      body {
        --dashboard-sidebar-condensed-width:0rem;
        --dashboard-sidebar-expanded-width:20rem;
        --dashboard-sidebar-open-width:20rem;
        --header-height: auto;        
        font-family: system-ui, sans-serif;
        font-size: 1rem;
        line-height: 1.7;

        display: grid;

        grid-template-columns: 0rem 1fr;

        grid-template-rows: auto auto 1fr;

        grid-template-areas:
          "sidebar header"
          "sidebar tabs"
          "sidebar main"
          "sidebar main";

        transition: grid-template-columns 0.3s ease-in-out;
      }

      .dashboard-header {
        grid-area: header;
        z-index: 900;
        .navbar{
          .expander { display: none;}  
        }
      }

      .dashboard-tabs {
        grid-area: tabs;
      }

      .dashboard-main {
        grid-area: main;
        margin-top: -10rem;
        padding-top: 10rem;
      }

      .dashboard-sidebar {
        grid-area: sidebar;     
        z-index: 1000;
        transition: width 0.3s ease-in-out;
        &.open {
          .close {
            display: block;
          }
        }
        &.open, &.hovered {
        &  aside {
            position: fixed;
            width: var(--dashboard-sidebar-open-width);
            top: 0;
            bottom: 0;
            inset-inline-start: 0;
          }
          .brand .logo {
            display: block;
          }
          .brand .emblem {
            display: none;
          }
          .menu {
              details  ul {
                display: block;
              }
              span {
              display: block;
              }
              summary:after {
                display: block;
              }
          }
          .tabs {
            button {
              display: block;
            }
            div {
              display: none;
            }
          }
        }
        aside {
          color:rgb(195, 195, 195);
          width: var(--dashboard-sidebar-condensed-width);
          transition: width 0.3s ease-in-out;
          z-index: 990;
          .brand .logo {
            display: none;
          }
          .brand .emblem {
            display: block;
          }
          .close {
            display: none;
          }
          .menu {
              details  ul {
                display: none;
              }
              span {
              display: none;
              white-space: nowrap;
              }
              summary:after {
                display: none;
              }
          }
          .tabs {
            button {
              display: none;
            }
            div {
              display: flex;
            }
          }
          .toggle {
            --tglbg: oklch(0 0 0 / 0.88);
          }
        }
      }

      .sidebar-overlay {
        position: fixed;
        top: 0;
        inset-inline-start: 0;
        bottom: 0;
        z-index: 950;
        background-color: rgba(0, 0, 0, 0.5);
        transition: width 0.2s ease-in-out;
        &.open {
          inset-inline-end: 0;
        }
      }

      html[dir="rtl"] { /* Or html[dir="rtl"] depending on your setup */
              .expander {
                rotate:180deg;                                    
              }  
              
              .os-scrollbar {
                inset-inline-start: auto;
                inset-inline-end: 0;

                &.os-scrollbar-horizontal {
                  bottom: 0; /* !important removed */

                  .os-scrollbar-handle {
                    inset-inline-start: auto;
                    inset-inline-end: 0;
                  }

                  .os-scrollbar-track { /* If needed */
                    inset-inline-start: auto;
                    inset-inline-end: 0;
                  }
                }

                &.os-scrollbar-vertical {
                  inset-inline-end: 0; /* !important removed */

                  .os-scrollbar-handle {
                    inset-inline-start: auto;
                    inset-inline-end: 0;
                  }

                  .os-scrollbar-track { /* If needed */
                    inset-inline-start: auto;
                    inset-inline-end: 0;
                  }
                }
              }
            }

            @media (min-width: 768px) {
        body {
          --dashboard-sidebar-condensed-width:5rem;
          grid-template-columns: var(--dashboard-sidebar-condensed-width) 1fr;
          .dashboard-header {
            .navbar {
              .expander { display: flex;}
              .show { display: none;}
            } 
          }
          &.expanded {
            grid-template-columns: var(--dashboard-sidebar-expanded-width) 1fr;
            .dashboard-header {                           
              .navbar{
                .expander {
                  transform: scale(-1);                                     
                }  
              }
            }
            .dashboard-sidebar {              
              aside {
                width: var(--dashboard-sidebar-expanded-width);
                  .brand .logo {
                  display: block;
                }
                .brand .emblem {
                  display: none;
                }
                .menu {
                  details  ul {
                    display: block;
                  }
                  span {
                  display: block;
                  }
                  summary:after {
                    display: block;
                  }
                }
                .tabs {
                  button {
                    display: block;
                  }
                  div {
                    display: none;
                  }
                }
              }
            }
          }
        }      
      }

    </style>
  </head>
  <body
    class="overflow-hidden"
    :class="{ 'expanded': appData.theme.expanded }"
    x-data="{
      sidebarOpen: false,
      sidebarHovered: false,
      }"        
  >
    <dashboard-header shadow class="dashboard-header"></dashboard-header>
    <!--<dashboard-header2 dat-component-src="_components/dashboard-header.tmpl" class="dashboard-header"></dashboard-header2>-->

    <dashboard-tabs shadow
      class="dashboard-tabs bg-base-300/80 -mb-14 z-10 transition-all"
      :class="{ '-mt-16 h-0 overflow-hidden': !appData.bookmarks.visible, }"
     ></dashboard-tabs>
    
    <dashboard-sidebar shadow
      id="sidebar"
      class="dashboard-sidebar bg-neutral"
      :class="{ 'open': sidebarOpen, 'hovered': sidebarHovered && !sidebarOpen }"
      @mouseenter="if (!sidebarOpen) sidebarHovered = true"
      @mouseleave="sidebarHovered = false; if (!event.target.closest('#sidebar .close')) sidebarOpen = false;"
    ></dashboard-sidebar>

    <dashboard-main shadow class="dashboard-main"></dashboard-main>
    
    <script>

    </script>

  </body>
</html>
