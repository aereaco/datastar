<!DOCTYPE html>
<html lang="en" data-router="{default: '/#Home'}">
  
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aerea Dashboard</title>
    <!-- DaisyUI -->
    <link href="assets/styles/daisyui@5.0.46.css" rel="stylesheet" type="text/css" />

    <!-- OverlayScrollbars -->
    <link href="assets/styles/overlayscrollbars@2.10.1.css" rel="stylesheet" type="text/css">   
    <script src="assets/scripts/overlayscrollbars@2.10.1.js"></script>
    <script src="assets/scripts/globalscrollbars-osb-plugin.js" async></script>
      
    <!-- TailwindCSS -->
    <script src="assets/scripts/tailwindcss@4.1.11.js"></script>

    <!-- Datastar & Plugins -->
    <script type="module" src="../../bundles/nexus-ux.js"></script>

    <style>
            
      h1 {
        font-size: 1.25rem;
        line-height: 1.25;
      }

      h2 {
        font-size: 0.875rem;
      }

      p {
        margin-block-end: 1.5rem;
      }

      body, html {
        height: 100vh;
        transition: margin-inline 5.3s ease-in-out;
      }

      
      body {
        --admin-sidebar-condensed-width:0rem;
        --admin-sidebar-expanded-width:20rem;
        --admin-sidebar-open-width:20rem;
        --header-height: auto;        
        font-family: system-ui, sans-serif;
        font-size: 1rem;
        line-height: 1.7;

        display: grid;

        grid-template-columns: 0rem 1fr;

        grid-template-rows: auto auto 1fr;

        grid-template-areas:
          "sidebar header"
          "sidebar tabs"
          "sidebar main"
          "sidebar main";

        transition: grid-template-columns 0.3s ease-in-out;
      }

      .admin-header {
        grid-area: header;
        z-index: 900;
        .navbar{
          .expander { display: none;}  
        }
      }

      .admin-tabs {
        grid-area: tabs;
      }

      .admin-main {
        grid-area: main;
        margin-top: -10rem;
        padding-top: 10rem;
      }

      .admin-sidebar {
        grid-area: sidebar;     
        z-index: 1000;
        transition: width 0.3s ease-in-out;
        &.open {
          .close {
            display: block;
          }
        }
        &.open, &.hovered {
        &  aside {
            position: fixed;
            width: var(--admin-sidebar-open-width);
            top: 0;
            bottom: 0;
            inset-inline-start: 0;
          }
          .brand .logo {
            display: block;
          }
          .brand .emblem {
            display: none;
          }
          .menu {
              details  ul {
                display: block;
              }
              span {
              display: block;
              }
              summary:after {
                display: block;
              }
          }
          .tabs {
            button {
              display: block;
            }
            div {
              display: none;
            }
          }
        }
        aside {
          color:rgb(195, 195, 195);
          width: var(--admin-sidebar-condensed-width);
          transition: width 0.3s ease-in-out;
          z-index: 990;
          .brand .logo {
            display: none;
          }
          .brand .emblem {
            display: block;
          }
          .close {
            display: none;
          }
          .menu {
              details  ul {
                display: none;
              }
              span {
              display: none;
              white-space: nowrap;
              }
              summary:after {
                display: none;
              }
          }
          .tabs {
            button {
              display: none;
            }
            div {
              display: flex;
            }
          }
          .toggle {
            --tglbg: oklch(0 0 0 / 0.88);
          }
        }
      }

      .sidebar-overlay {
        position: fixed;
        top: 0;
        inset-inline-start: 0;
        bottom: 0;
        z-index: 950;
        background-color: rgba(0, 0, 0, 0.5);
        transition: width 0.2s ease-in-out;
        &.open {
          inset-inline-end: 0;
        }
      }

      html[dir="rtl"] { /* Or html[dir="rtl"] depending on your setup */
              .expander {
                rotate:180deg;                                    
              }  
              
              .os-scrollbar {
                inset-inline-start: auto;
                inset-inline-end: 0;

                &.os-scrollbar-horizontal {
                  bottom: 0; /* !important removed */

                  .os-scrollbar-handle {
                    inset-inline-start: auto;
                    inset-inline-end: 0;
                  }

                  .os-scrollbar-track { /* If needed */
                    inset-inline-start: auto;
                    inset-inline-end: 0;
                  }
                }

                &.os-scrollbar-vertical {
                  inset-inline-end: 0; /* !important removed */

                  .os-scrollbar-handle {
                    inset-inline-start: auto;
                    inset-inline-end: 0;
                  }

                  .os-scrollbar-track { /* If needed */
                    inset-inline-start: auto;
                    inset-inline-end: 0;
                  }
                }
              }
            }

            @media (min-width: 768px) {
        body {
          --admin-sidebar-condensed-width:5rem;
          grid-template-columns: var(--admin-sidebar-condensed-width) 1fr;
          .admin-header {
            .navbar {
              .expander { display: flex;}
              .show { display: none;}
            } 
          }
          &.expanded {
            grid-template-columns: var(--admin-sidebar-expanded-width) 1fr;
            .admin-header {                           
              .navbar{
                .expander {
                  transform: scale(-1);                                     
                }  
              }
            }
            .admin-sidebar {              
              aside {
                width: var(--admin-sidebar-expanded-width);
                  .brand .logo {
                  display: block;
                }
                .brand .emblem {
                  display: none;
                }
                .menu {
                  details  ul {
                    display: block;
                  }
                  span {
                  display: block;
                  }
                  summary:after {
                    display: block;
                  }
                }
                .tabs {
                  button {
                    display: block;
                  }
                  div {
                    display: none;
                  }
                }
              }
            }
          }
        }      
      }

    </style>
  </head>
  <body
    class="overflow-hidden"
  >
    <admin-header
      class="admin-header bg-neutral"
      data-component="_components/admin-header.html"
    ></admin-header>

    <admin-tabs
      class="admin-tabs bg-base-300/80 -mb-14 z-10 transition-all"
      data-component="_components/admin-tabs.html"
     ></admin-tabs>
    
    <admin-sidebar
      id="sidebar"
      class="admin-sidebar bg-neutral"
      data-component="_components/admin-sidebar.html"
    ></admin-sidebar>

    <admin-main
      class="admin-main"
      data-component="$router.route"
    >
  
  </admin-main>

  <template id="Home">
    <div class="flex flex-col h-full">
      <div class="flex-1 p-6">
        <h1 class="text-2xl font-bold mb-4">Welcome to the Aerea Nexus</h1>
        <p class="text-lg">This is your main area where you can manage your documents and settings.</p>
      </div>
      <div class="p-6">
        <button class="btn btn-primary">Get Started</button>
      </div>
    </div>
  </template>
  
    
    <script>

    </script>

  </body>
</html>
