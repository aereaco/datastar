<template>
    <div data-signals="{ 
        listA: ['Item 1A', 'Item 2A', 'Item 3A', 'Item 4A'],
        listB: ['Item 1B', 'Item 2B', 'Item 3B'],
        listC: ['Item 1C', 'Item 2C', 'Item 3C', 'Item 4C', 'Item 5C'],
        listD: ['H-Item 1', 'H-Item 2', 'H-Item 3']
    }">
        <h1 class="text-2xl font-bold mb-4">DaisyUI Sortable Demo</h1>

        <!-- Scenario 1: Single List Sort -->
        <h2 class="text-xl font-semibold mt-8 mb-2">List A (Single List Sort)</h2>
        <div data-sort="$listA.reorder($itemKey, $newIndex)" class="p-4 bg-base-200 rounded-box flex flex-col gap-2">
            <div data-sort-item="Item 1A" data-animate-flip class="btn btn-ghost">Item 1A</div>
            <div data-sort-item="Item 2A" data-animate-flip class="btn btn-ghost">Item 2A</div>
            <div data-sort-item="Item 3A" data-animate-flip class="btn btn-ghost">Item 3A</div>
            <div data-sort-item="Item 4A" data-animate-flip class="btn btn-ghost">Item 4A</div>
        </div>

        <!-- Scenario 2 & 3: Cross-List Sort -->
        <h2 class="text-xl font-semibold mt-8 mb-2">Cross-List Sort (Group 'sharedGroup')</h2>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <h3 class="font-bold mb-2">List B</h3>
                <div data-sort="$listB.reorder($itemKey, $newIndex)" data-sort-group="sharedGroup:pull(true):put(true)" class="p-4 bg-base-200 rounded-box flex flex-col gap-2 min-h-48">
                    <div data-sort-item="Item 1B" data-animate-flip class="btn btn-ghost">Item 1B</div>
                    <div data-sort-item="Item 2B" data-animate-flip class="btn btn-ghost">Item 2B</div>
                    <div data-sort-item="Item 3B" data-animate-flip class="btn btn-ghost">Item 3B</div>
                </div>
            </div>
            <div>
                <h3 class="font-bold mb-2">List C (Clone & Filter)</h3>
                <div data-sort="$listC.reorder($itemKey, $newIndex)" data-sort-group="sharedGroup:pull(clone):put(true)" data-sort-config='{ "filter": ".no-drag" }' class="p-4 bg-base-200 rounded-box flex flex-col gap-2 min-h-48">
                    <div data-sort-item="Item 1C" data-animate-flip class="btn btn-ghost">Item 1C</div>
                    <div data-sort-item="Item 2C" data-animate-flip class="btn btn-ghost">Item 2C</div>
                    <div data-sort-item="Item 3C" data-animate-flip class="btn btn-ghost no-drag btn-disabled">Item 3C</div>
                    <div data-sort-item="Item 4C" data-animate-flip class="btn btn-ghost">Item 4C</div>
                    <div data-sort-item="Item 5C" data-animate-flip class="btn btn-ghost">Item 5C</div>
                </div>
            </div>
        </div>

        <!-- Scenario 4: Horizontal Sort with Handle -->
        <h2 class="text-xl font-semibold mt-8 mb-2">List D (Horizontal Sort with Handle)</h2>
        <div data-sort="$listD.reorder($itemKey, $newIndex)" data-sort-config='{ "direction": "horizontal" }' class="p-4 bg-base-200 rounded-box flex flex-row gap-2">
            <div data-sort-item="H-Item 1" data-animate-flip class="btn btn-ghost">
                <span data-sort-handle class="cursor-move">☰</span>
                <span class="ml-2">H-Item 1</span>
            </div>
            <div data-sort-item="H-Item 2" data-animate-flip class="btn btn-ghost">
                <span data-sort-handle class="cursor-move">☰</span>
                <span class="ml-2">H-Item 2</span>
            </div>
            <div data-sort-item="H-Item 3" data-animate-flip class="btn btn-ghost">
                <span data-sort-handle class="cursor-move">☰</span>
                <span class="ml-2">H-Item 3</span>
            </div>
        </div>
    </div>

    <script>
        if (!Object.prototype.reorder) {
            Object.defineProperty(Object.prototype, 'reorder', {
                value: function(itemKey, newIndex) {
                    if (!this.value || !Array.isArray(this.value)) return;
                    const list = this.value.slice();
                    const oldIndex = list.indexOf(itemKey);
                    if (oldIndex > -1) {
                        const [movedItem] = list.splice(oldIndex, 1);
                        list.splice(newIndex, 0, movedItem);
                        this.value = list;
                    }
                },
                writable: true,
                configurable: true,
            });
        }
    </script>
</template>
